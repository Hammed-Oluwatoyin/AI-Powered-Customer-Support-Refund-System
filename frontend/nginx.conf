# Rendered by the nginx image's envsubst step; ${API_UPSTREAM} comes from the
# container environment (see Dockerfile).
server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Container healthcheck; does not depend on the backend.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API: the browser only ever talks to nginx.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Vite emits content-hashed file names, so assets can be cached for a long time.
  location /assets/ {
    expires 1y;
  }

  # SPA fallback: client-side routes such as /chat and /admin serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
