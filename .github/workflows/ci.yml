name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, e2e, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same Postgres major version as Compose (Twelve-Factor X: dev/prod parity).
        image: postgres:16-alpine
        env:
          POSTGRES_USER: refunds
          POSTGRES_PASSWORD: refunds
          POSTGRES_DB: refunds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refunds -d refunds_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LLM_PROVIDER: mock
      TEST_DATABASE_URL: postgresql://refunds:refunds@localhost:5432/refunds_test
      ADMIN_API_KEY: ci-admin-key-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Health endpoint through nginx
        run: curl --fail --silent --show-error http://localhost:3000/api/health
      - name: Frontend is served
        run: curl --fail --silent --show-error http://localhost:3000/ | grep -q "<title>Refund Support</title>"
      - name: Database was migrated and seeded
        run: |
          customers=$(docker compose exec -T postgres psql -U refunds -d refunds -tAc 'SELECT count(*) FROM "Customer"')
          echo "Seeded customers: $customers"
          test "$customers" = "15"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes
